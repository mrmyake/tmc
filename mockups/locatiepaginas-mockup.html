<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMC dienst- en locatiepagina's, mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --warm-black: #0E0C0B;
    --surface: #171412;
    --surface-lift: #1F1B18;
    --stone: #F4EFE6;
    --stone-muted: rgba(244, 239, 230, 0.62);
    --stone-faint: rgba(244, 239, 230, 0.14);
    --champagne: #B9986A;
    --champagne-soft: rgba(185, 152, 106, 0.14);
    --card-radius: 8px;
    --control-radius: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050404; color: var(--stone); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 15px; }
  a { color: inherit; }
  button { font: inherit; }

  /* ---------- Mockup-omgeving (geen onderdeel van het ontwerp) ---------- */
  .toolbar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 24px; background: rgba(5,4,4,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--stone-faint); }
  .toolbar h1 { font-family: Fraunces, serif; font-weight: 400; font-size: 19px; margin-right: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--stone-faint); border-radius: var(--control-radius); overflow: hidden; flex-wrap: wrap; }
  .seg button { background: none; border: 0; color: var(--stone-muted); padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--champagne); color: var(--warm-black); font-weight: 600; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--stone-muted); cursor: pointer; }
  .check input { accent-color: var(--champagne); }

  .board { padding: 28px 24px 60px; max-width: 1680px; margin: 0 auto; }
  .frames { display: grid; grid-template-columns: 406px minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 1000px) { .frames { grid-template-columns: 1fr; justify-items: center; } .desk-col { width: 100%; } }
  .desk-col { min-width: 0; }
  .frame-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--stone-muted); margin-bottom: 10px; }
  .frame-label code { text-transform: none; letter-spacing: 0; color: var(--champagne); font-size: 12px; }
  .phone { width: 406px; height: 796px; border-radius: 34px; border: 8px solid #1d1a18; overflow: hidden; background: var(--warm-black); position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .phone .scroller { height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .phone .scroller::-webkit-scrollbar { display: none; }
  .desk-wrap { width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid #262220; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .desk-chrome { height: 30px; background: #1a1715; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .desk-chrome i { width: 9px; height: 9px; border-radius: 50%; background: #3a3532; display: block; }
  .desk-chrome span { margin-left: 14px; font-size: 11px; color: var(--stone-muted); background: #0f0d0c; padding: 3px 12px; border-radius: 4px; }
  .desk-scale { transform-origin: top left; width: 1280px; }
  .desktop { width: 1280px; height: 800px; overflow-y: auto; background: var(--warm-black); scrollbar-width: thin; }

  .notes { margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .note { background: var(--surface); border: 1px solid var(--stone-faint); border-radius: var(--card-radius); padding: 20px 22px; }
  .note h3 { font-family: Fraunces, serif; font-weight: 400; font-size: 19px; margin-bottom: 12px; }
  .note p, .note li { font-size: 13.5px; line-height: 1.55; color: var(--stone-muted); }
  .note li { margin: 0 0 8px 16px; }
  .note strong { color: var(--stone); font-weight: 500; }
  .note code { font-size: 12px; color: var(--champagne); }
  .note table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .note th, .note td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--stone-faint); vertical-align: top; color: var(--stone-muted); }
  .note th { color: var(--stone); font-weight: 500; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
  .tag.must { background: var(--champagne); color: var(--warm-black); }
  .tag.should { border: 1px solid var(--champagne); color: var(--champagne); }
  .tag.could { border: 1px solid var(--stone-faint); color: var(--stone-muted); }

  /* Invulplekken: inhoud die Marlon of Ilja nog moet aanleveren */
  .fill { display: inline; border: 1px dashed var(--champagne); color: var(--champagne); background: var(--champagne-soft); border-radius: 3px; padding: 1px 6px; font-size: 0.86em; font-style: normal; white-space: normal; }
  body.hide-fill .fill { border-color: transparent; background: none; color: inherit; padding: 0; }
  body.hide-fill .fill::before { content: ""; }

  /* =====================================================================
     ONTWERP. Container queries: dezelfde markup schakelt op framebreedte.
     ===================================================================== */
  .screen { container-type: inline-size; min-height: 100%; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 22px; }
  @container (min-width: 900px) { .wrap { padding: 0 48px; } }

  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 20px; letter-spacing: 0.02em; text-decoration: none; }
  .wordmark span { color: var(--champagne); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--champagne); }
  .display { font-family: Fraunces, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1.06; }
  .muted { color: var(--stone-muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; background: var(--champagne); color: var(--warm-black); border: 0; border-radius: var(--control-radius); font-weight: 600; font-size: 15.5px; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: none; color: var(--stone); border: 1px solid var(--stone-faint); font-weight: 500; }
  .btn-row { display: grid; gap: 10px; margin-top: 24px; }
  @container (min-width: 900px) { .btn-row { display: flex; gap: 12px; } }
  .link { color: var(--stone); text-decoration: underline; text-decoration-color: var(--champagne); text-underline-offset: 4px; }

  .rating { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--stone-muted); }
  .rating .stars { color: var(--champagne); letter-spacing: 1px; }
  .rating b { color: var(--stone); font-weight: 600; }

  .photo { position: relative; overflow: hidden; border-radius: var(--card-radius); background: radial-gradient(120% 80% at 70% 30%, rgba(185,152,106,0.35), transparent 60%), radial-gradient(90% 70% at 30% 90%, rgba(244,239,230,0.10), transparent 60%), linear-gradient(160deg, #3a2f26 0%, #1c1714 55%, #110e0c 100%); }
  .photo .ph-label { position: absolute; top: 12px; left: 12px; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(244,239,230,0.75); background: rgba(14,12,11,0.55); padding: 4px 8px; border-radius: 3px; }
  .photo svg.figure { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 86%; opacity: 0.22; }

  /* Nav */
  .site-nav { border-bottom: 1px solid var(--stone-faint); }
  .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .site-nav ul { display: none; list-style: none; gap: 26px; font-size: 14px; color: var(--stone-muted); align-items: center; }
  .site-nav ul .navbtn { background: var(--champagne); color: var(--warm-black); padding: 9px 14px; border-radius: var(--control-radius); font-weight: 600; }
  .site-nav .menu { width: 22px; height: 14px; border-top: 1.5px solid var(--stone); border-bottom: 1.5px solid var(--stone); position: relative; }
  .site-nav .menu::after { content: ""; position: absolute; left: 0; right: 0; top: 5.5px; border-top: 1.5px solid var(--stone); }
  @container (min-width: 900px) { .site-nav .wrap { height: 76px; } .site-nav ul { display: flex; } .site-nav .menu { display: none; } }

  .crumbs { font-size: 12.5px; color: var(--stone-muted); padding: 16px 0 0; }
  .crumbs a { text-decoration: none; }
  .crumbs span { margin: 0 6px; opacity: 0.6; }

  /* Hero */
  .hero { padding: 18px 0 34px; }
  .hero-grid { display: grid; gap: 26px; }
  .hero-grid > * { min-width: 0; }
  .hero h1 { font-size: 40px; margin: 12px 0 14px; }
  .hero .lead { font-size: 16px; line-height: 1.55; color: var(--stone-muted); max-width: 32em; }
  .hero .meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--stone-muted); }
  .hero .meta b { color: var(--stone); font-weight: 500; }
  .hero-photo { height: 260px; }
  .hero-photo .chip { position: absolute; left: 14px; bottom: 14px; background: rgba(14,12,11,0.78); backdrop-filter: blur(6px); padding: 8px 12px; border-radius: var(--control-radius); }
  .formerly { margin-top: 16px; font-size: 13px; color: var(--stone-muted); border-left: 2px solid var(--champagne); padding-left: 10px; }
  @container (min-width: 900px) {
    .hero { padding: 30px 0 64px; }
    .hero-grid { grid-template-columns: 1.05fr 0.95fr; gap: 64px; align-items: center; }
    .hero h1 { font-size: 62px; }
    .hero .lead { font-size: 18px; }
    .hero-photo { height: 440px; }
  }

  /* Secties */
  .sec { border-top: 1px solid var(--stone-faint); padding: 34px 0 36px; }
  .sec h2 { font-size: 28px; margin: 10px 0 14px; }
  .sec .intro { font-size: 15px; line-height: 1.6; color: var(--stone-muted); max-width: 40em; }
  @container (min-width: 900px) { .sec { padding: 64px 0; } .sec h2 { font-size: 40px; } .sec .intro { font-size: 16.5px; } }
  .two { display: grid; gap: 22px; }
  .two > * { min-width: 0; }
  @container (min-width: 900px) { .two { grid-template-columns: 0.9fr 1.1fr; gap: 64px; align-items: start; } }

  .benefits { list-style: none; display: grid; gap: 0; margin-top: 20px; border-top: 1px solid var(--stone-faint); }
  .benefits li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--stone-faint); }
  .benefits .n { font-family: Fraunces, serif; color: var(--champagne); font-size: 19px; line-height: 1.1; }
  .benefits b { display: block; font-weight: 500; font-size: 15px; margin-bottom: 3px; }
  .benefits span { font-size: 13.5px; color: var(--stone-muted); line-height: 1.5; }
  @container (min-width: 900px) { .benefits.cols { grid-template-columns: repeat(3, 1fr); gap: 32px; border-top: 0; } .benefits.cols li { border-bottom: 0; border-top: 1px solid var(--stone-faint); } }

  .cards { display: grid; gap: 12px; margin-top: 22px; }
  @container (min-width: 900px) { .cards { grid-template-columns: repeat(3, 1fr); gap: 16px; } .cards.four { grid-template-columns: repeat(4, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--stone-faint); border-radius: var(--card-radius); padding: 20px; text-decoration: none; display: flex; flex-direction: column; gap: 8px; }
  .card.accent { border-top: 2px solid var(--champagne); }
  .card h3 { font-family: Fraunces, serif; font-weight: 400; font-size: 21px; }
  .card p { font-size: 13.5px; line-height: 1.5; color: var(--stone-muted); }
  .card .go { margin-top: auto; padding-top: 6px; font-size: 13.5px; color: var(--champagne); }
  .card .big { font-family: Fraunces, serif; font-size: 30px; line-height: 1; }
  .card .big small { font-family: Inter, sans-serif; font-size: 12.5px; color: var(--stone-muted); margin-left: 6px; }

  .trainer { display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center; margin-top: 20px; }
  .trainer .photo { width: 84px; height: 84px; border-radius: 50%; }
  .trainer b { font-family: Fraunces, serif; font-weight: 400; font-size: 21px; display: block; }
  .trainer span { font-size: 13.5px; color: var(--stone-muted); line-height: 1.5; }

  .sched-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 12px; }
  .sched-head span { font-size: 12.5px; color: var(--stone-muted); }
  .sched-list { display: grid; gap: 8px; }
  .sched-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--card-radius); padding: 12px 14px; }
  .sched-row .d { font-size: 12px; color: var(--stone-muted); line-height: 1.3; }
  .sched-row .d b { display: block; font-family: Fraunces, serif; font-weight: 400; font-size: 18px; color: var(--stone); font-variant-numeric: tabular-nums; }
  .sched-row .c { font-size: 14.5px; font-weight: 500; }
  .sched-row .c small { display: block; font-weight: 400; font-size: 12.5px; color: var(--stone-muted); margin-top: 2px; }
  .sched-row .s { font-size: 12px; color: var(--champagne); white-space: nowrap; }

  .travel { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
  .travel th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--stone-muted); padding: 0 10px 10px 0; }
  .travel td { padding: 13px 10px 13px 0; border-top: 1px solid var(--stone-faint); vertical-align: middle; }
  .travel td:first-child { font-family: Fraunces, serif; font-size: 18px; }
  .travel td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .travel a { color: var(--champagne); text-decoration: none; font-size: 13.5px; white-space: nowrap; }
  .travel .hide-m { display: none; }
  @container (min-width: 900px) { .travel .hide-m { display: table-cell; } .travel td:first-child { font-size: 20px; } }

  .route { display: grid; gap: 10px; margin-top: 20px; }
  @container (min-width: 900px) { .route { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
  .route .card { flex-direction: row; gap: 14px; align-items: flex-start; }
  .route .ico { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--champagne-soft); color: var(--champagne); display: grid; place-items: center; }
  .route .ico svg { width: 18px; height: 18px; }
  .route b { display: block; font-weight: 500; font-size: 15px; margin-bottom: 3px; }
  .map { height: 220px; margin-top: 14px; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  @container (min-width: 900px) { .map { height: 100%; min-height: 360px; margin-top: 0; } }

  .quote { background: var(--surface); border-radius: var(--card-radius); padding: 24px 22px; margin-top: 20px; border-left: 2px solid var(--champagne); }
  .quote p { font-family: Fraunces, serif; font-weight: 300; font-size: 21px; line-height: 1.4; }
  .quote cite { display: block; margin-top: 14px; font-style: normal; font-size: 13px; color: var(--stone-muted); }
  @container (min-width: 900px) { .quote { padding: 34px 36px; } .quote p { font-size: 26px; } }

  .hours { display: grid; gap: 8px; margin-top: 18px; }
  .hours div { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--stone-faint); font-size: 14px; }
  .hours div span:last-child { color: var(--stone-muted); text-align: right; }

  .faq { margin-top: 18px; border-top: 1px solid var(--stone-faint); }
  .faq details { border-bottom: 1px solid var(--stone-faint); }
  .faq summary { list-style: none; cursor: pointer; padding: 17px 30px 17px 0; font-size: 15.5px; font-weight: 500; position: relative; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 2px; top: 13px; font-family: Fraunces, serif; font-size: 24px; color: var(--champagne); font-weight: 300; }
  .faq details[open] summary::after { content: "−"; }
  .faq details p { padding: 0 0 18px; font-size: 14.5px; line-height: 1.6; color: var(--stone-muted); max-width: 44em; }

  .places { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .places a { text-decoration: none; border: 1px solid var(--stone-faint); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; }
  .places a:hover { border-color: var(--champagne); }

  .closing { border-top: 1px solid var(--stone-faint); padding: 44px 0 48px; text-align: center; }
  .closing h2 { font-size: 32px; }
  .closing p { margin: 12px auto 0; max-width: 30em; font-size: 15px; color: var(--stone-muted); line-height: 1.55; }
  .closing .btn-row { justify-content: center; }
  @container (min-width: 900px) { .closing { padding: 72px 0; } .closing h2 { font-size: 48px; } }

  .site-foot { margin-top: auto; border-top: 1px solid var(--stone-faint); padding: 34px 0 26px; font-size: 13px; color: var(--stone-muted); }
  .foot-grid { display: grid; gap: 26px; }
  @container (min-width: 900px) { .foot-grid { grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 40px; } }
  .foot-grid h4 { font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin-bottom: 12px; }
  .foot-grid ul { list-style: none; display: grid; gap: 8px; }
  .foot-grid a { text-decoration: none; }
  .foot-grid .hl a { color: var(--champagne); }
  .foot-legal { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--stone-faint); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; }

  /* ---------- v2: eigen hoofdelement per paginatype ---------- */
  .light { background: var(--stone); color: var(--warm-black); }
  .light .eyebrow { color: #8a6c43; }
  .light .intro, .light .muted, .light p { color: rgba(14,12,11,0.68); }
  .light .sec, .light.sec { border-top: 0; }

  /* Dienstpagina: beeldvullende hero met cijferbalk */
  .hero-full { position: relative; min-height: 520px; display: flex; align-items: flex-end; border-radius: 0; }
  .hero-full .ph-label { top: 14px; left: 14px; }
  .hero-full::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,12,11,0) 20%, rgba(14,12,11,0.92) 88%); }
  .hero-full .wrap { position: relative; z-index: 2; padding-bottom: 30px; }
  .hero-full h1 { font-size: 46px; margin: 10px 0 12px; max-width: 11em; }
  .hero-full .lead { font-size: 16px; line-height: 1.55; color: rgba(244,239,230,0.78); max-width: 30em; }
  @container (min-width: 900px) { .hero-full { min-height: 640px; } .hero-full h1 { font-size: 84px; } .hero-full .lead { font-size: 19px; } .hero-full .wrap { padding-bottom: 56px; } .hero-full .btn-row { margin-top: 28px; } }
  .statbar { border-top: 1px solid var(--stone-faint); border-bottom: 1px solid var(--stone-faint); }
  .statbar .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
  .statbar div.s { padding: 18px 0; }
  .statbar div.s + div.s { border-left: 1px solid var(--stone-faint); padding-left: 14px; }
  .statbar b { display: block; font-family: Fraunces, serif; font-weight: 400; font-size: 26px; color: var(--champagne); }
  .statbar span { font-size: 12px; color: var(--stone-muted); }
  @container (min-width: 900px) { .statbar div.s { padding: 26px 0; } .statbar div.s + div.s { padding-left: 32px; } .statbar b { font-size: 38px; } .statbar span { font-size: 13.5px; } }

  .moves { display: grid; gap: 14px; margin-top: 26px; }
  @container (min-width: 900px) { .moves { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  .move { background: #EAE3D6; border-radius: var(--card-radius); overflow: hidden; }
  .move .photo { height: 170px; border-radius: 0; }
  .move .body { padding: 18px 18px 20px; }
  .move .k { font-family: Fraunces, serif; font-size: 13px; color: #8a6c43; }
  .move h3 { font-family: Fraunces, serif; font-weight: 400; font-size: 24px; margin: 4px 0 6px; color: var(--warm-black); }
  .move p { font-size: 14px; line-height: 1.5; }
  @container (min-width: 900px) { .move .photo { height: 220px; } }

  .regio-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 22px 0; }
  .regio-line p { font-size: 14.5px; color: var(--stone-muted); flex: 1 1 280px; }
  .regio-line .places { margin-top: 0; }

  /* Locatiepagina: de reis is de hero */
  .hero-route { padding: 18px 0 36px; }
  .hero-route .grid { display: grid; gap: 22px; }
  .hero-route .grid > * { min-width: 0; }
  .hero-route h1 { font-size: 40px; margin: 12px 0 14px; }
  .hero-route .lead { font-size: 16px; line-height: 1.55; color: var(--stone-muted); }
  @container (min-width: 900px) { .hero-route { padding: 34px 0 64px; } .hero-route .grid { grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; } .hero-route h1 { font-size: 60px; } .hero-route .lead { font-size: 18px; } }
  .trip { background: var(--surface); border: 1px solid var(--stone-faint); border-radius: var(--card-radius); overflow: hidden; }
  .trip-map { position: relative; height: 210px; background: radial-gradient(90% 90% at 80% 10%, rgba(185,152,106,0.18), transparent 60%), #13100e; }
  .trip-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }

function render() {
  var html = PAGES[state]();
  document.getElementById('mobile').innerHTML = html;
  document.getElementById('desktop').innerHTML = html;
  document.getElementById('notes').innerHTML = NOTES[state];
  document.getElementById('urlBar').textContent = 'themovementclub.nl' + URLS[state];
  document.getElementById('urlM').textContent = URLS[state];
  document.getElementById('mobile').scrollTop = 0;
  document.getElementById('desktop').scrollTop = 0;
  fit();
}

function fit() {
  var wrap = document.getElementById('deskWrap');
  var scale = Math.min(wrap.clientWidth / 1280, 1);
  var sc = document.getElementById('deskScale');
  sc.style.transform = 'scale(' + scale + ')';
  sc.style.height = (800 * scale) + 'px';
  sc.parentNode.style.height = (800 * scale + 30) + 'px';
}

document.querySelectorAll('[data-page]').forEach(function (b) {
  b.addEventListener('click', function () {
    state = b.dataset.page;
    document.querySelectorAll('[data-page]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    history.replaceState(null, '', '#' + state);
    render();
  });
});
document.getElementById('fillToggle').addEventListener('change', function (e) {
  document.body.classList.toggle('hide-fill', !e.target.checked);
});
window.addEventListener('resize', fit);

var h = location.hash.replace('#', '');
if (PAGES[h]) {
  state = h;
  document.querySelectorAll('[data-page]').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.page === h); });
}
render();
