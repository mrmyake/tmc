// Lokale Capacitor-plugin rond de Akiles Mobile SDK (workstream E2).
// Zelfde opzet als de @capacitor/*-plugins; de SDK komt als AAR uit de
// Maven-repo van Akiles (versie gelijk houden aan de iOS-xcframework in
// ../Package.swift). Het AAR-manifest declareert zelf alle Bluetooth-,
// locatie- en NFC-permissies; dit module-manifest voegt niets toe.
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    akilesSdkVersion = '2.6.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "nl.themovementclub.akiles"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        // De Akiles-SDK ondersteunt API 23+; Bluetooth vanaf API 29. De app
        // zelf staat op minSdk 24 (android/variables.gradle).
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url = uri("https://maven.akiles.app/release")
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "app.akiles:sdk:$akilesSdkVersion"
    testImplementation "junit:junit:$junitVersion"
}
