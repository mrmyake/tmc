<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hormoonprofiel, mockup v1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050404; color: #F4EFE6; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 15px; }
  a { color: inherit; }
  button, input, textarea { font: inherit; }

  /* ---------- Mockup-omgeving (geen onderdeel van het ontwerp) ---------- */
  .toolbar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 24px; background: rgba(5,4,4,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(244,239,230,0.14); }
  .toolbar h1 { font-family: Fraunces, serif; font-weight: 400; font-size: 19px; margin-right: 8px; }
  .seg { display: inline-flex; border: 1px solid rgba(244,239,230,0.14); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: none; border: 0; color: rgba(244,239,230,0.62); padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: #B9986A; color: #0E0C0B; font-weight: 600; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: rgba(244,239,230,0.62); cursor: pointer; }
  .check input { accent-color: #B9986A; }
  .board { padding: 28px 24px 60px; max-width: 1680px; margin: 0 auto; }
  .frames { display: grid; grid-template-columns: 406px minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 1000px) { .frames { grid-template-columns: 1fr; justify-items: center; } .desk-col { width: 100%; } }
  .desk-col { min-width: 0; }
  .frame-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(244,239,230,0.62); margin-bottom: 10px; }
  .frame-label code { text-transform: none; letter-spacing: 0; color: #B9986A; font-size: 12px; }
  .phone { width: 406px; height: 796px; border-radius: 34px; border: 8px solid #1d1a18; overflow: hidden; background: #0E0C0B; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .phone .scroller { height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .phone .scroller::-webkit-scrollbar { display: none; }
  .desk-wrap { width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid #262220; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .desk-chrome { height: 30px; background: #1a1715; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .desk-chrome i { width: 9px; height: 9px; border-radius: 50%; background: #3a3532; display: block; }
  .desk-chrome span { margin-left: 14px; font-size: 11px; color: rgba(244,239,230,0.62); background: #0f0d0c; padding: 3px 12px; border-radius: 4px; }
  .desk-scale { transform-origin: top left; width: 1280px; }
  .desktop { width: 1280px; height: 800px; overflow-y: auto; scrollbar-width: thin; }
  .notes { margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .note { background: #171412; border: 1px solid rgba(244,239,230,0.14); border-radius: 8px; padding: 20px 22px; }
  .note h3 { font-family: Fraunces, serif; font-weight: 400; font-size: 19px; margin-bottom: 12px; }
  .note p, .note li { font-size: 13.5px; line-height: 1.55; color: rgba(244,239,230,0.62); }
  .note li { margin: 0 0 8px 16px; }
  .note strong { color: #F4EFE6; font-weight: 500; }
  .note code { font-size: 12px; color: #B9986A; }
  .note table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .note th, .note td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid rgba(244,239,230,0.14); vertical-align: top; color: rgba(244,239,230,0.62); }
  .note th { color: #F4EFE6; font-weight: 500; white-space: nowrap; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
  .tag.must { background: #B9986A; color: #0E0C0B; }
  .tag.should { border: 1px solid #B9986A; color: #B9986A; }
  .tag.could { border: 1px solid rgba(244,239,230,0.14); color: rgba(244,239,230,0.62); }

  /* =====================================================================
     ONTWERP. Eén set componenten, twee identiteiten via CSS-variabelen.
     .hp  = hormoonprofiel.com (standalone, eigen identiteit)
     .tmc = themovementclub.nl/hormoonprofiel (sectie binnen TMC)
     ===================================================================== */
  .screen { container-type: inline-size; min-height: 100%; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
  .screen.hp { --bg: #F4EFE6; --fg: #0E0C0B; --muted: rgba(14,12,11,0.66); --line: rgba(14,12,11,0.13); --surface: #EBE4D7; --surface-2: #E2DACB; --accent: #4E5C46; --accent-ink: #4E5C46; --accent-soft: rgba(78,92,70,0.10); --btn-fg: #F4EFE6; }
  .screen.tmc { --bg: #0E0C0B; --fg: #F4EFE6; --muted: rgba(244,239,230,0.62); --line: rgba(244,239,230,0.14); --surface: #171412; --surface-2: #1F1B18; --accent: #B9986A; --accent-ink: #B9986A; --accent-soft: rgba(185,152,106,0.14); --btn-fg: #0E0C0B; }

  .fill { display: inline; border: 1px dashed var(--accent); color: var(--accent-ink); background: var(--accent-soft); border-radius: 3px; padding: 1px 6px; font-size: 0.86em; font-style: normal; }
  body.hide-fill .fill { border-color: transparent; background: none; color: inherit; padding: 0; }

  .wrap { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 22px; }
  @container (min-width: 900px) { .wrap { padding: 0 48px; } }
  .display { font-family: Fraunces, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1.08; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; background: var(--accent); color: var(--btn-fg); border: 0; border-radius: 4px; font-weight: 600; font-size: 15.5px; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  .btn-row { display: grid; gap: 10px; margin-top: 24px; }
  @container (min-width: 900px) { .btn-row { display: flex; gap: 12px; } }
  .link { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }

  .photo { position: relative; overflow: hidden; border-radius: 8px; }
  .hp .photo { background: radial-gradient(110% 80% at 75% 25%, rgba(78,92,70,0.30), transparent 60%), radial-gradient(90% 70% at 20% 90%, rgba(185,152,106,0.22), transparent 60%), linear-gradient(160deg, #d9d0bf 0%, #c9bea9 60%, #b8ad97 100%); }
  .tmc .photo { background: radial-gradient(120% 80% at 70% 30%, rgba(185,152,106,0.35), transparent 60%), linear-gradient(160deg, #3a2f26 0%, #1c1714 55%, #110e0c 100%); }
  .photo .ph-label { position: absolute; top: 12px; left: 12px; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; }
  .hp .photo .ph-label { color: rgba(14,12,11,0.7); background: rgba(244,239,230,0.7); }
  .tmc .photo .ph-label { color: rgba(244,239,230,0.75); background: rgba(14,12,11,0.55); }
  .photo svg.figure { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 84%; opacity: 0.18; }

  /* Nav standalone */
  .hp-nav { border-bottom: 1px solid var(--line); }
  .hp-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .hp-mark { text-decoration: none; display: flex; flex-direction: column; line-height: 1; }
  .hp-mark b { font-family: Fraunces, serif; font-weight: 400; font-size: 22px; letter-spacing: -0.01em; }
  .hp-mark b span { color: var(--accent-ink); font-style: italic; }
  .hp-mark small { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  .navlinks { display: none; list-style: none; gap: 24px; font-size: 14px; color: var(--muted); align-items: center; }
  .navlinks .navbtn { background: var(--accent); color: var(--btn-fg); padding: 9px 14px; border-radius: 4px; font-weight: 600; }
  .menu { width: 22px; height: 14px; border-top: 1.5px solid var(--fg); border-bottom: 1.5px solid var(--fg); position: relative; }
  .menu::after { content: ""; position: absolute; left: 0; right: 0; top: 5.5px; border-top: 1.5px solid var(--fg); }
  @container (min-width: 900px) { .hp-nav .wrap { height: 80px; } .navlinks { display: flex; } .menu { display: none; } }

  /* Nav TMC + sectiebalk */
  .tmc-nav { border-bottom: 1px solid var(--line); }
  .tmc-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 20px; letter-spacing: 0.02em; text-decoration: none; }
  .wordmark span { color: #B9986A; }
  @container (min-width: 900px) { .tmc-nav .wrap { height: 76px; } }
  .secbar { border-bottom: 1px solid var(--line); background: var(--surface); }
  .secbar .wrap { display: flex; align-items: center; gap: 16px; height: 48px; overflow-x: auto; scrollbar-width: none; }
  .secbar .wrap::-webkit-scrollbar { display: none; }
  .secbar b { font-family: Fraunces, serif; font-weight: 400; font-size: 16px; white-space: nowrap; color: var(--accent-ink); }
  .secbar a { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .secbar a.on { color: var(--fg); border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
  .crumbs { font-size: 12.5px; color: var(--muted); padding: 16px 0 0; }
  .crumbs span { margin: 0 6px; opacity: 0.6; }

  /* Hero */
  .hero { padding: 22px 0 36px; }
  .hero-grid { display: grid; gap: 26px; }
  .hero-grid > * { min-width: 0; }
  .hero h1 { font-size: 40px; margin: 12px 0 14px; }
  .hero .lead { font-size: 16px; line-height: 1.55; color: var(--muted); max-width: 32em; }
  .hero .meta { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
  .hero .meta span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
  .hero-photo { height: 280px; }
  @container (min-width: 900px) {
    .hero { padding: 40px 0 70px; }
    .hero-grid { grid-template-columns: 1.05fr 0.95fr; gap: 64px; align-items: center; }
    .hero h1 { font-size: 60px; }
    .hero .lead { font-size: 18px; }
    .hero-photo { height: 460px; }
  }

  .kort { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 18px 20px; margin-top: 4px; }
  .kort .eyebrow { margin-bottom: 8px; }
  .kort p { font-size: 15px; line-height: 1.6; }
  @container (min-width: 900px) { .kort { padding: 24px 30px; } .kort p { font-size: 17px; } }

  .sec { border-top: 1px solid var(--line); padding: 36px 0; }
  .sec h2 { font-size: 28px; margin: 10px 0 14px; }
  .sec .intro { font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 40em; }
  @container (min-width: 900px) { .sec { padding: 66px 0; } .sec h2 { font-size: 40px; } .sec .intro { font-size: 16.5px; } }
  .sec.alt { background: var(--surface); border-top: 0; }
  .two { display: grid; gap: 22px; }
  .two > * { min-width: 0; }
  @container (min-width: 900px) { .two { grid-template-columns: 0.9fr 1.1fr; gap: 64px; align-items: start; } }

  /* Traject */
  .steps { list-style: none; margin-top: 24px; display: grid; gap: 0; border-top: 1px solid var(--line); }
  .steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .steps .n { font-family: Fraunces, serif; font-size: 26px; line-height: 1; color: var(--accent-ink); }
  .steps b { display: block; font-weight: 500; font-size: 16px; margin-bottom: 4px; }
  .steps span { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .steps em { display: inline-block; margin-top: 8px; font-style: normal; font-size: 12px; color: var(--accent-ink); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  @container (min-width: 900px) { .steps.row { grid-template-columns: repeat(5, 1fr); gap: 24px; border-top: 0; } .steps.row li { grid-template-columns: 1fr; border-bottom: 0; border-top: 2px solid var(--line); padding-top: 18px; } .steps.row li:first-child { border-top-color: var(--accent); } }

  /* Profielkaarten */
  .pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  @container (min-width: 900px) { .pcards { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  .pcard { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; min-height: 128px; }
  .tmc .sec.alt .pcard { background: var(--surface-2); }
  .pcard h3 { font-family: Fraunces, serif; font-weight: 400; font-size: 21px; }
  .pcard p { font-size: 13px; line-height: 1.45; color: var(--muted); }
  .pcard .go { margin-top: auto; font-size: 13px; color: var(--accent-ink); }
  @container (min-width: 900px) { .pcard { padding: 22px; min-height: 150px; } .pcard h3 { font-size: 26px; } .pcard p { font-size: 14px; } }

  /* Marlon */
  .person { display: grid; gap: 20px; }
  .person .photo { height: 300px; }
  @container (min-width: 900px) { .person { grid-template-columns: 0.8fr 1.2fr; gap: 56px; align-items: center; } .person .photo { height: 420px; } }
  .creds { list-style: none; margin-top: 18px; display: grid; gap: 10px; }
  .creds li { font-size: 14px; padding-left: 22px; position: relative; line-height: 1.5; }
  .creds li::before { content: ""; position: absolute; left: 0; top: 7px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }

  /* Wel / niet */
  .wn { display: grid; gap: 12px; margin-top: 22px; }
  @container (min-width: 900px) { .wn { grid-template-columns: 1fr 1fr; gap: 20px; } }
  .wn div { border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .wn h3 { font-family: Fraunces, serif; font-weight: 400; font-size: 22px; margin-bottom: 10px; }
  .wn ul { list-style: none; display: grid; gap: 8px; }
  .wn li { font-size: 14px; line-height: 1.5; color: var(--muted); padding-left: 20px; position: relative; }
  .wn .yes li::before { content: "+"; position: absolute; left: 0; color: var(--accent-ink); font-weight: 600; }
  .wn .no li::before { content: "\00d7"; position: absolute; left: 1px; color: var(--muted); }

  /* FAQ */
  .faq { margin-top: 18px; border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; padding: 17px 30px 17px 0; font-size: 15.5px; font-weight: 500; position: relative; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 2px; top: 12px; font-family: Fraunces, serif; font-size: 24px; color: var(--accent-ink); font-weight: 300; transition: transform .2s; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { padding: 0 0 18px; font-size: 14.5px; line-height: 1.6; color: var(--muted); max-width: 44em; }

  /* Kennismakingsformulier */
  .closing { border-top: 1px solid var(--line); padding: 40px 0 44px; }
  .closing .two { align-items: center; }
  .closing h2 { font-size: 32px; margin: 10px 0 12px; }
  .closing p.sub { font-size: 15px; color: var(--muted); line-height: 1.55; max-width: 28em; }
  .form { display: grid; gap: 12px; background: var(--surface); border-radius: 8px; padding: 20px; }
  .form label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .form input, .form textarea { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 12px; font-size: 15px; }
  .form textarea { min-height: 84px; resize: none; }
  .form .row2 { display: grid; gap: 12px; }
  .form small { font-size: 12px; color: var(--muted); line-height: 1.5; }
  @container (min-width: 900px) { .closing { padding: 72px 0; } .closing h2 { font-size: 46px; } .form { padding: 28px; } .form .row2 { grid-template-columns: 1fr 1fr; } }

  /* Disclaimer + footer */
  .disclaimer { border-top: 1px solid var(--line); padding: 16px 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .disclaimer b { color: var(--fg); font-weight: 500; }
  .site-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 34px 0 26px; font-size: 13px; color: var(--muted); }
  .foot-grid { display: grid; gap: 26px; }
  @container (min-width: 900px) { .foot-grid { grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 40px; } }
  .foot-grid h4 { font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); margin-bottom: 12px; }
  .foot-grid ul { list-style: none; display: grid; gap: 8px; }
  .foot-grid a { text-decoration: none; }
  .foot-grid .hl a { color: var(--accent-ink); }
  .foot-legal { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; }

  /* ---------- Profielenpagina ---------- */
  .page-head { padding: 22px 0 30px; }
  .page-head h1 { font-size: 40px; margin: 10px 0 18px; }
  .byline { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 13px; color: var(--muted); }
  .byline .photo { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .byline b { color: var(--fg); font-weight: 500; }
  @container (min-width: 900px) { .page-head { padding: 40px 0 50px; } .page-head h1 { font-size: 60px; max-width: 14em; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .chips a { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; }
  .chips a:hover { border-color: var(--accent); }
  .warn { margin-top: 16px; font-size: 13.5px; line-height: 1.55; color: var(--muted); padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; }
  .warn b { color: var(--fg); font-weight: 500; }

  .prof { border-top: 1px solid var(--line); padding: 30px 0; }
  .prof-grid { display: grid; gap: 16px; }
  .prof-grid > * { min-width: 0; }
  .prof .idx { font-family: Fraunces, serif; font-size: 14px; color: var(--accent-ink); }
  .prof h2 { font-size: 34px; margin: 4px 0 6px; }
  .prof .sub { font-size: 14.5px; color: var(--muted); }
  .facets { display: grid; gap: 10px; }
  .facet { background: var(--surface); border-radius: 8px; padding: 16px 18px; }
  .facet h3 { font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 6px; }
  .facet p { font-size: 14.5px; line-height: 1.55; }
  .facet.note2 p { color: var(--muted); font-size: 13.5px; }
  @container (min-width: 900px) { .prof { padding: 50px 0; } .prof-grid { grid-template-columns: 0.75fr 1.25fr; gap: 56px; } .prof h2 { font-size: 46px; } .facets { grid-template-columns: 1fr 1fr; gap: 14px; } .facet.wide { grid-column: 1 / -1; } }

  /* ---------- Inhoudspagina-sjabloon ---------- */
  .article { display: grid; gap: 30px; padding-bottom: 20px; }
  .article > * { min-width: 0; }
  @container (min-width: 900px) { .article { grid-template-columns: minmax(0, 1fr) 300px; gap: 72px; } }
  .prose h2 { font-size: 28px; margin: 34px 0 10px; }
  .prose h2:first-child { margin-top: 0; }
  .prose p { font-size: 16px; line-height: 1.7; color: var(--muted); margin-bottom: 14px; max-width: 38em; }
  .prose ul.q { list-style: none; display: grid; gap: 8px; margin: 6px 0 16px; }
  .prose ul.q li { font-size: 15px; padding: 12px 14px; background: var(--surface); border-radius: 6px; }
  .prose .dur { display: inline-block; font-size: 12px; color: var(--accent-ink); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin-left: 8px; vertical-align: 6px; font-family: Inter, sans-serif; }
  .get { list-style: none; display: grid; gap: 0; border-top: 1px solid var(--line); margin: 10px 0 16px; }
  .get li { display: flex; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .get li span { color: var(--muted); font-size: 13.5px; text-align: right; }
  @container (min-width: 900px) { .prose h2 { font-size: 34px; margin-top: 46px; } .prose p { font-size: 17px; } }
  .aside { display: grid; gap: 16px; align-content: start; }

var PAGES = { home: home, profielen: profielen, hoewerkt: hoewerkt };

function render() {
  var html = PAGES[page]();
  document.getElementById('mobile').innerHTML = html;
  document.getElementById('desktop').innerHTML = html;
  document.getElementById('notes').innerHTML = NOTES[page]();
  var u = url(page);
  document.getElementById('urlBar').textContent = u;
  document.getElementById('urlM').textContent = u.replace(/^[^/]+/, '') || '/';
  document.getElementById('mobile').scrollTop = 0;
  document.getElementById('desktop').scrollTop = 0;
  fit();
}

function fit() {
  var wrap = document.getElementById('deskWrap');
  var scale = Math.min(wrap.clientWidth / 1280, 1);
  var sc = document.getElementById('deskScale');
  sc.style.transform = 'scale(' + scale + ')';
  sc.style.height = (800 * scale) + 'px';
  sc.parentNode.style.height = (800 * scale + 30) + 'px';
}

function setPressed(attr, val) {
  document.querySelectorAll('[' + attr + ']').forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute(attr) === val); });
}
document.querySelectorAll('[data-page]').forEach(function (b) {
  b.addEventListener('click', function () { page = b.dataset.page; setPressed('data-page', page); history.replaceState(null, '', '#' + mode + '-' + page); render(); });
});
document.querySelectorAll('[data-mode]').forEach(function (b) {
  b.addEventListener('click', function () { mode = b.dataset.mode; setPressed('data-mode', mode); history.replaceState(null, '', '#' + mode + '-' + page); render(); });
});
document.getElementById('fillToggle').addEventListener('change', function (e) {
  document.body.classList.toggle('hide-fill', !e.target.checked);
});
window.addEventListener('resize', fit);

var h = location.hash.replace('#', '').split('-');
if (h.length === 2 && (h[0] === 'hp' || h[0] === 'tmc') && PAGES[h[1]]) { mode = h[0]; page = h[1]; }
setPressed('data-page', page); setPressed('data-mode', mode);
render();
